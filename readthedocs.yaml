# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    # Install pretab itself so autodoc can import the package.
    - method: pip
      path: .
    # Documentation-only build dependencies (Sphinx, theme, extensions).
    - requirements: docs/requirements_docs.txt
